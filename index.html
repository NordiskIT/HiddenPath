<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Path</title>
  <style>
    body { margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:Georgia, 'Palatino Linotype', serif; background: radial-gradient(circle at 20% 15%, rgba(255,179,71,0.16), transparent 26%), radial-gradient(circle at 78% 22%, rgba(224,123,57,0.14), transparent 22%), linear-gradient(160deg, #2a1608 0%, #4a2c12 45%, #1f1206 100%); background-size: 220% 220%, 180% 180%, auto; animation: bgShift 18s ease infinite; color:#f7ecd9; text-align:center; }
    body.arrived { background: radial-gradient(circle at 15% 15%, rgba(255,230,115,0.40), transparent 28%), radial-gradient(circle at 80% 15%, rgba(255,195,80,0.30), transparent 22%), radial-gradient(circle at 60% 75%, rgba(192,57,43,0.28), transparent 30%), linear-gradient(160deg, #5b3b11 0%, #b07c24 40%, #ffdb7f 100%); background-size: 240% 240%, 200% 200%, 180% 180%, auto; animation: warmShift 16s ease infinite; }
    @keyframes bgShift { 0% { background-position: 0% 0%, 100% 0%, 0% 0%; } 25% { background-position: 30% 10%, 70% 30%, 0% 0%; } 50% { background-position: 20% 30%, 25% 20%, 0% 0%; } 75% { background-position: 10% 20%, 40% 15%, 0% 0%; } 100% { background-position: 0% 0%, 100% 0%, 0% 0%; } }
    @keyframes warmShift { 0% { background-position: 0% 0%, 100% 5%, 100% 90%, 0% 0%; } 25% { background-position: 25% 15%, 75% 30%, 15% 40%, 0% 0%; } 50% { background-position: 20% 25%, 25% 40%, 30% 25%, 0% 0%; } 75% { background-position: 10% 15%, 15% 20%, 40% 15%, 0% 0%; } 100% { background-position: 0% 0%, 100% 5%, 100% 90%, 0% 0%; } }
    main { width:min(92vw, 520px); border:2px solid rgba(255,179,71,0.45); border-radius:24px; padding:24px; background: linear-gradient(180deg, rgba(43, 26, 13, 0.98), rgba(30, 18, 8, 0.96)); box-shadow:0 15px 40px rgba(0,0,0,0.45); }
    h1 { margin:0 0 10px; font-size:clamp(1.6rem, 4.5vw, 2.5rem); letter-spacing:0.08em; text-transform:uppercase; color:#ffcf7d; text-shadow:0 0 14px rgba(255,179,71,0.35); }
    p { margin:12px 0; line-height:1.7; }
    #status { font-size:1.05rem; color:#f7ecd9; line-height:1.6; }
    .indicator { font-size:clamp(1.3rem, 5vw, 1.9rem); font-weight:700; margin:16px 0; color:#ffb347; }
    #proximityBar { position:relative; height:18px; border:2px solid rgba(255,179,71,0.45); border-radius:999px; background: linear-gradient(90deg, rgba(90, 58, 30, 0.95), rgba(107, 68, 35, 0.95)); overflow:hidden; margin:0 auto 16px; width:min(86vw, 380px); box-shadow: inset 0 0 12px rgba(0,0,0,0.4); }
    #proximityBar span { display:block; height:100%; width:0%; background: linear-gradient(90deg, rgba(224, 123, 57, 0.95), rgba(255, 179, 71, 0.95)); box-shadow:0 0 12px rgba(255,179,71,0.4); transition:width 0.35s ease; }
    #locationDetails { display:none; margin-top:18px; padding:18px; border:1px solid rgba(255,179,71,0.30); border-radius:18px; background: rgba(43, 26, 13, 0.75); }
    #locationImage { height:clamp(120px, 40vw, 200px); border-radius:14px; background: linear-gradient(135deg, rgba(224,123,57,0.20), rgba(30,18,8,0.98)); background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; color:#f7ecd9; font-size:0.95rem; letter-spacing:0.04em; text-transform:uppercase; }
    #locationHint { margin:12px 0 0; font-size:1rem; line-height:1.7; color:#f7ecd9; }
    #nextBtn { display:none; margin-top:18px; padding:16px 24px; font-size:1.05rem; border:none; border-radius:12px; background:#c85a17; color:#fff8e7; cursor:pointer; transition:background .2s, transform .2s; box-shadow:0 6px 18px rgba(200, 90, 23, 0.35); }
    #nextBtn:hover { background:#e07b39; transform:translateY(-1px); }
    #passwordModal {
      position:fixed;
      inset:0;
      display:none;
      justify-content:center;
      align-items:center;
      background:rgba(20,10,4,0.6);
      z-index:1000;
    }
    #passwordModal.active { display:flex; }
    #passwordDialog {
      width:min(90vw, 340px);
      background:rgba(31, 18, 8, 0.98);
      border:2px solid rgba(255,179,71,0.85);
      border-radius:18px;
      padding:18px 18px 14px;
      box-shadow:0 18px 40px rgba(0,0,0,0.4);
      color:#f7ecd9;
      text-align:left;
    }
    #passwordDialog h2 { margin:0 0 10px; font-size:1.15rem; letter-spacing:0.08em; text-transform:uppercase; color:#ffcf7d; }
    #passwordDialog input { width:100%; padding:12px 12px; font-size:16px; border:1px solid rgba(255,179,71,0.55); border-radius:10px; background:#2b1a0d; color:#f7ecd9; margin:8px 0; }
    #passwordDialog button { min-width:100px; margin:8px 6px 0 0; padding:14px 16px; font-size:1rem; border:none; border-radius:10px; background:#c85a17; color:#fff8e7; cursor:pointer; }
    #passwordDialog button:hover { background:#e07b39; }
    #passwordError { margin-top:8px; color:#ff9b7d; font-size:0.95rem; min-height:1.2em; }
    .error { color:#ff9b7d; }
    button, input, #pageTitle { touch-action: manipulation; }
    #echoRing {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 50vmin;
      height: 50vmin;
      margin: -25vmin 0 0 -25vmin;
      border-radius: 50%;
      border: 3px solid rgba(255, 230, 185, 0.65);
      opacity: 0;
      pointer-events: none;
      z-index: -1;
      animation: echoRing 5s ease-out infinite;
    }
    @keyframes echoRing {
      0%   { transform: scale(0.25); opacity: 0.7; }
      20%  { transform: scale(2.5);  opacity: 0; }
      100% { transform: scale(2.5);  opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="echoRing" aria-hidden="true"></div>
  <main>
    <h1 id="pageTitle">Hidden Path</h1>
    <p id="status">Venter på lokation...</p>
    <div class="indicator" id="proximityLabel">Afstand: --</div>
    <div id="proximityBar"><span></span></div>
    <button id="nextBtn">Næste</button>
    <div id="locationDetails">
      <div id="locationImage">Billede</div>
      <p id="locationHint">Find stedet</p>
    </div>

    <p id="locationInfo"></p>
  </main>

  <div id="passwordModal" aria-hidden="true">
    <div id="passwordDialog">
      <h2>Kode</h2>
      <p>Indtast koden</p>
      <input id="passwordInput" type="text" autocomplete="off" placeholder="ABC" />
      <div id="passwordError"></div>
      <div>
        <button id="passwordCancel">Annuller</button>
        <button id="passwordConfirm">OK</button>
      </div>
    </div>
  </div>

  <script>
    const IMAGE_FOLDER = 'images/';
    const imageStatus = {}; // index -> 'ok' | 'missing'

    const points = [
    { name:'', lat:56.302108, lon:9.637719, maxDistance:500, approvedDistance:10, hint:'Find skruen og betal vogteren', imageText:'' },
    { name:'', lat:56.300734, lon:9.637134, maxDistance:500, approvedDistance:10, hint:'Find skruen og betal vogteren', imageText:'' },
    { name:'', lat:56.300754, lon:9.632317, maxDistance:500, approvedDistance:10, hint:'Find skruen og betal vogteren', imageText:'' },
    { name:'', lat:56.302735, lon:9.631898, maxDistance:500, approvedDistance:10, hint:'Find skruen og betal vogteren', imageText:'' },
    { name:'', lat:56.302100, lon:9.634184, maxDistance:500, approvedDistance:10, hint:'Find skruen og betal vogteren', imageText:'' },
    { name:'', lat:56.302706, lon:9.635299, maxDistance:500, approvedDistance:10, hint:'Find skruen og betal vogteren', imageText:'' },
    ];

    let currentIndex = 0;
    let currentPosition = null;
    let watchId = null;
    const statusEl = document.getElementById('status');
    const proximityLabel = document.getElementById('proximityLabel');
    const nextBtn = document.getElementById('nextBtn');
    const locationInfo = document.getElementById('locationInfo');
    const pageTitle = document.getElementById('pageTitle');
    const passwordModal = document.getElementById('passwordModal');
    const passwordInput = document.getElementById('passwordInput');
    const passwordError = document.getElementById('passwordError');
    const passwordConfirm = document.getElementById('passwordConfirm');
    const passwordCancel = document.getElementById('passwordCancel');
    const jumpCodes = {
      A: 0, B: 1, C: 2, D: 3, E: 4, F: 5
    };

    function toRadians(deg) { return deg * Math.PI / 180; }

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRadians(lat1))*Math.cos(toRadians(lat2))*Math.sin(dLon/2)**2;
      const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R*c;
    }

    function formatDistance(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(2)} km`; }

    function setStatus(message, isError=false) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'error' : '';
    }

    function renderTarget() {
      // The current target is intentionally hidden from the UI.
    }

    function handleTitleClick(event) {
      openPasswordModal();
    }

    function openPasswordModal() {
      passwordError.textContent = '';
      passwordInput.value = '';
      passwordModal.classList.add('active');
      passwordModal.setAttribute('aria-hidden', 'false');
      passwordInput.focus();
      setStatus('Indtast kode for at hoppe til et punkt.');
    }

    function closePasswordModal() {
      passwordModal.classList.remove('active');
      passwordModal.setAttribute('aria-hidden', 'true');
      passwordError.textContent = '';
      passwordInput.value = '';
      setStatus('');
    }

    function confirmPassword() {
      const entered = passwordInput.value.trim().toUpperCase();
      if (!jumpCodes.hasOwnProperty(entered)) {
        passwordError.textContent = 'Forkert kode';
        return;
      }
      const index = jumpCodes[entered];
      currentIndex = index;
      closePasswordModal();
      setStatus(`Hurtigt hop til punkt ${entered} gennemført.`);
      updateUI();
    }

    function getImageFileForIndex(index) {
      return `${IMAGE_FOLDER}${index + 1}.jpeg`;
    }

    function showLocationImage(index, imageFile) {
      const locationImage = document.getElementById('locationImage');
      const status = imageStatus[index];
      if (status === 'ok') {
        locationImage.style.backgroundImage = `url('${imageFile}')`;
        locationImage.style.display = 'flex';
        locationImage.textContent = '';
      } else if (status === 'missing') {
        locationImage.style.backgroundImage = '';
        locationImage.style.display = 'none';
        locationImage.textContent = '';
      } else {
        const img = new Image();
        img.onload = () => { imageStatus[index] = 'ok'; showLocationImage(index, imageFile); };
        img.onerror = () => { imageStatus[index] = 'missing'; showLocationImage(index, imageFile); };
        img.src = imageFile;
      }
    }

    function updateUI() {
      if (!currentPosition) return;
      const p = points[currentIndex];
      const dist = haversine(currentPosition.lat, currentPosition.lon, p.lat, p.lon);
      const locationDetails = document.getElementById('locationDetails');
      const locationImage = document.getElementById('locationImage');
      const locationHint = document.getElementById('locationHint');
      const proximityLabel = document.getElementById('proximityLabel');
      const proximityBar = document.querySelector('#proximityBar span');
      const ratio = Math.min(dist / p.maxDistance, 1);
      const fill = 100 - Math.round(ratio * 100);

      proximityLabel.textContent = `Afstand: ${formatDistance(dist)}`;
      proximityBar.style.width = `${fill}%`;
      locationInfo.textContent = '';

      if (dist <= p.approvedDistance) {
        document.body.classList.add('arrived');
        setStatus('Du har fundet det!');
        const imageFile = getImageFileForIndex(currentIndex);
        locationHint.textContent = p.hint;
        locationDetails.style.display = 'block';
        nextBtn.style.display = 'inline-block';
        nextBtn.textContent = (currentIndex < points.length - 1) ? 'Næste' : 'Start forfra';
        showLocationImage(currentIndex, imageFile);
      } else {
        document.body.classList.remove('arrived');
        setStatus('');
        locationImage.style.backgroundImage = '';
        locationImage.style.display = 'none';
        locationImage.textContent = 'Billede';
        locationDetails.style.display = 'none';
        nextBtn.style.display = 'none';
      }
    }

    function handleGeoSuccess(pos) {
      currentPosition = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      renderTarget();
      updateUI();
    }

    function handleGeoError(err) {
      setStatus('Geolokalisering-fejl: ' + err.message, true);
    }

    pageTitle.addEventListener('click', handleTitleClick);
    passwordConfirm.addEventListener('click', confirmPassword);
    passwordCancel.addEventListener('click', closePasswordModal);
    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') confirmPassword();
      if (event.key === 'Escape') closePasswordModal();
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < points.length - 1) {
        currentIndex += 1;
        renderTarget();
        updateUI();
        setStatus('Næste mål. Fortsæt med at bevæge dig.');
      } else {
        currentIndex = 0;
        renderTarget();
        updateUI();
        setStatus('Missionen er genstartet. Find det første sted.');
      }
    });

    function init() {
      if (!navigator.geolocation) {
        setStatus('Geolokalisering understøttes ikke af browseren', true);
        return;
      }
      renderTarget();
      setStatus('Anmoder om lokationsopdateringer...');
      watchId = navigator.geolocation.watchPosition(handleGeoSuccess, handleGeoError, { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
    }

    renderTarget();
    init();
  </script>
</body>
</html>
